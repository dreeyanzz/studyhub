name: Bug
description: Something is broken. The fix branch goes under the story whose code it fixes.
title: 'Bug: '
labels: ['type:bug']
body:
  - type: input
    id: story
    attributes:
      label: Related story
      placeholder: '#'
  - type: textarea
    id: observed
    attributes:
      label: What happened
      description: The error, the wrong screen, or the missing data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Which seeded account, which page, what you clicked.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: local / cloud dev / Vercel preview / production, browser
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: ['Blocks work', 'Wrong data or security', 'Annoying', 'Cosmetic']
