# The job name `checks` is a required status check on main; renaming it blocks
# every PR until the ruleset is updated. There are no `paths:` filters on
# purpose: a required check that never runs leaves docs-only PRs waiting.
# The job name `db` is a required check too (D-014): it applies every migration
# and seed.sql to a fresh local stack, runs the pgTAP policy tests, and checks
# that the committed database types match the migrations.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    env:
      # Placeholders so `next build` can run; no job talks to a real project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  db:
    name: db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Only Postgres and Auth are needed: the seed writes auth.users, and the
      # tests talk to Postgres directly. Excluding the rest keeps the job fast.
      - run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npm run db:test
      # Every story imports these types, so a stale file would type their code
      # against a schema that no longer exists.
      - name: Generated types match the migrations
        run: |
          npm run db:types
          git diff --exit-code lib/supabase/database.types.ts || {
            echo "::error file=lib/supabase/database.types.ts::Out of date. Run npm run db:types and commit the result."
            exit 1
          }

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # A green run takes about 7 minutes. A stuck stack or browser install fails the
    # job here instead of holding a runner for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Starts the local Supabase stack keeping Kong, PostgREST and Auth, which the
      # app needs (STORY-06 design §5). Seed accounts come from supabase/seed.sql.
      - run: >-
          npx supabase start
          -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # In CI, Playwright retries a failed test once and records a trace of the retry
      # in test-results/ (playwright.config.ts). Upload it, or it is lost with the runner.
      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
