# Checks what lands on main. With squash merges, the PR title becomes the
# commit subject and the PR body becomes the commit body, so both are checked
# here, together with the branch name the CPEPE361 brief requires.
# The job name `pr-title` is a required status check on main; renaming it
# blocks every PR until the ruleset is updated.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: true
          scopes: |
            STORY-[0-9]{2}
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            Start the summary with a lowercase letter, e.g. "feat(STORY-01): add profiles table".

      - name: Check branch name and PR body
        env:
          BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          fail=0
          err() { echo "::error::$1"; fail=1; }
          if ! printf '%s' "$HEAD_REF" | grep -Eq '^feature/STORY-[0-9]{2}-[a-z0-9-]+$'; then
            err "Branch '$HEAD_REF' must be feature/STORY-xx-short-desc (course rule). See docs/guides/working-with-git-and-prs.md."
          fi
          if [ -z "$BODY" ]; then
            err "The PR body is empty. Use the PR template; it becomes the commit message on main."
          fi
          if printf '%s' "$BODY" | grep -q '<!--'; then
            err "Remove HTML comments from the PR body; they would land in the commit on main."
          fi
          if printf '%s' "$BODY" | grep -Eq '^Closes #[[:space:]]*$'; then
            err "Fill in 'Closes #<issue>' or delete that line."
          fi
          if printf '%s' "$BODY" | grep -Eq '^Co-Authored-By:[[:space:]]*$'; then
            err "Fill in the Co-Authored-By line, or delete it if no AI was used."
          fi
          if [ "$(printf '%s' "$BODY" | head -c 3 | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
            err "The PR body starts with a byte-order mark. Write it with Git Bash or a UTF-8 (no BOM) file."
          fi
          exit $fail
